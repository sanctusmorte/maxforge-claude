<svg xmlns="http://www.w3.org/2000/svg" width="320" height="120" viewBox="0 0 320 120" role="img" aria-label="Pulsing dot">
  <title>Pulsing dot</title>
  <style>
    .dot { fill: #2da44e; animation: slide 4s ease-in-out infinite alternate; }
    @keyframes slide { from { transform: translateX(0); } to { transform: translateX(240px); } }
    @media (prefers-reduced-motion: reduce) { .dot { animation: none; transform: translateX(240px); } }
  </style>
  <rect width="320" height="120" rx="8" fill="#f6f8fa"/>
  <circle class="dot" cx="40" cy="60" r="24"/>
  <text x="160" y="108" text-anchor="middle" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#1f2328">fixture</text>
</svg>
